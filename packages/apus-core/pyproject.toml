[project]
name = "apus-core"
version = "0.1.0"
description = "Domain types, coordinate frames, units and configuration shared by every Apus package."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = [
    "numpy>=2.5",
    "protobuf>=7.35",
    "pydantic>=2.14",
    "pyproj>=3.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
