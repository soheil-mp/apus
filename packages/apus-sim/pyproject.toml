[project]
name = "apus-sim"
version = "0.0.0"
description = "Physics-based lidar, scene and bird simulator: the digital twin of a monitoring site."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = ["apus-core"]

[project.scripts]
apus-sim = "apus_sim.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
apus-core = { workspace = true }
