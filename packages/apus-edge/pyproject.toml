[project]
name = "apus-edge"
version = "0.0.0"
description = "Edge runtime: frame assembly, detection, tracking, data reduction and publishing."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = ["apus-core"]

[project.scripts]
apus-edge = "apus_edge.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
apus-core = { workspace = true }
