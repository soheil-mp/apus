[project]
name = "apus-api"
version = "0.1.0"
description = "Read-only HTTP API over the analysis-ready (gold) tables."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = ["apus-core"]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
apus-core = { workspace = true }
